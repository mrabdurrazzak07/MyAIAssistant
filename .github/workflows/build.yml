name: Build Pixel 8 Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android Project
      run: |
        mkdir -p app/src/main/java/com/mycompany/myapp
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/values

        # settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MyAIAssistant"
        include ':app'
        EOF

        # build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
        }
        EOF

        # app build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.mycompany.myapp'
            compileSdk 34

            defaultConfig {
                applicationId "com.mycompany.myapp"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">My AI Agent</string>
        </resources>
        EOF

        # accessibility_service_config.xml
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:description="@string/app_name"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:notificationTimeout="100"
            android:canRetrieveWindowContent="true"
            android:canPerformGestures="true" />
        EOF

        # AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true">
                <service
                    android:name=".MyAIAgentService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        # MyAIAgentService.java
        cat << 'EOF' > app/src/main/java/com/mycompany/myapp/MyAIAgentService.java
        package com.mycompany.myapp;

        import android.accessibilityservice.AccessibilityService;
        import android.view.accessibility.AccessibilityEvent;
        import android.view.accessibility.AccessibilityNodeInfo;
        import java.util.List;

        public class MyAIAgentService extends AccessibilityService {
            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
                AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                if (rootNode == null) return;

                List<AccessibilityNodeInfo> nodes = rootNode.findAccessibilityNodeInfosByText("Search");
                if (nodes != null && !nodes.isEmpty()) {
                    for (AccessibilityNodeInfo node : nodes) {
                        if (node.isClickable()) {
                            node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                            break;
                        }
                    }
                }
            }

            @Override
            public void onInterrupt() {}
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.5"

    - name: Build APK with Gradle
      run: gradle assembleDebug

    - name: Upload Pixel 8 Pro APK
      uses: actions/upload-artifact@v4
      with:
        name: MyAIAgent-Pixel8Pro-APK
        path: app/build/outputs/apk/debug/app-debug.apk
